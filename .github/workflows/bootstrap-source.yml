name: Bootstrap verified STARCOM R0.1 source

on:
  push:
    branches:
      - bootstrap/r0.1-proof-gated-core
    paths:
      - .github/workflows/bootstrap-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-r0.1-bootstrap
  cancel-in-progress: false

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bootstrap/r0.1-proof-gated-core
          fetch-depth: 0

      - name: Reconstruct the sealed source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/source.b64.00
            cat .bootstrap/source.b64.01
            cat .bootstrap/correct/source.b64.02.*
            cat .bootstrap/source.b64.03
            cat .bootstrap/source.b64.04
            cat .bootstrap/source.b64.05
            cat .bootstrap/correct/source.b64.06.*
            cat .bootstrap/correct/source.b64.07.*
            cat .bootstrap/correct/source.b64.08.*
          } | base64 --decode > /tmp/starcom-r0.1-source.tar.gz
          echo '5f7303b7c353f794e6a23717038f229b121764b02df5cbb7f8d9519c0516a248  /tmp/starcom-r0.1-source.tar.gz' | sha256sum -c -
          rm -rf /tmp/starcom-r0.1-extract
          mkdir -p /tmp/starcom-r0.1-extract
          tar -xzf /tmp/starcom-r0.1-source.tar.gz -C /tmp/starcom-r0.1-extract
          test -d /tmp/starcom-r0.1-extract/starcom-r0.1

      - name: Install the exact archived tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-source.yml /tmp/bootstrap-source.yml
          tar -C /tmp/starcom-r0.1-extract/starcom-r0.1 -cf - . | tar -xf - -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-source.yml

      - name: Run deterministic repository verification
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 scripts/verify_repo.py
          sha256sum -c docs/proof/R0.1-FILE-HASHES.sha256

      - name: Commit the verified reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/bootstrap-source.yml .github/workflows/bootstrap-source.yml
          git config user.name 'STARCOM Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bootstrap STARCOM R0.1 proof-gated mission core'
          git push origin "HEAD:${GITHUB_REF_NAME}"
