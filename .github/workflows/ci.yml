name: STARCOM deterministic verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: starcom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record runtime
        run: python3 --version
      - name: Verify repository
        env:
          PYTHONPATH: src:.
        run: python3 scripts/verify_repo.py
