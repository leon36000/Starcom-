name: Publish verified STARCOM qualification and C3 CLI

on:
  push:
    branches:
      - control/qualification-c3-cli-20260814
    paths:
      - '.control/qualification-c3-cli/**'
      - '.github/workflows/publish-qualification-c3-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-qualification-c3-cli-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/qualification-c3-cli-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-qualification-cli
          cp .control/qualification-c3-cli/apply_patch.py /tmp/starcom-qualification-cli/
          sha256sum /tmp/starcom-qualification-cli/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/qualification-c3-cli f707b8b5d1f863f9c653b4a7c23770be35b47d3a
          test "$(git rev-parse HEAD)" = "f707b8b5d1f863f9c653b4a7c23770be35b47d3a"

      - name: Re-prove isolated qualification and C3 CLI RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_qualification_cli.py' -v > /tmp/starcom-qualification-cli/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-qualification-cli/red.log
          test "$red_status" -ne 0
          failures="$(grep -c '^FAIL:' /tmp/starcom-qualification-cli/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-qualification-cli/red.log || true)"
          test "$failures" -eq 4
          test "$errors" -eq 0
          grep -Fq "invalid choice: 'qualification'" /tmp/starcom-qualification-cli/red.log
          grep -Fq "invalid choice: 'c3'" /tmp/starcom-qualification-cli/red.log

      - name: Apply thin CLI patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-qualification-cli/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_qualification_cli.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_qualification_cli.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 4:
              raise SystemExit(f'expected 4 qualification CLI tests, found {focused}')
          if total != 172:
              raise SystemExit(f'expected 172 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: expose qualification laboratory and C3 CLI'
          git push origin 'HEAD:refs/heads/fix/qualification-c3-cli'
          git rev-parse HEAD
