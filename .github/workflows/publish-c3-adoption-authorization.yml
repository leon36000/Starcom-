name: Publish verified STARCOM C3 adoption authorization

on:
  push:
    branches:
      - control/c3-adoption-authorization-20260814
    paths:
      - '.control/c3-adoption-authorization/**'
      - '.github/workflows/publish-c3-adoption-authorization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-adoption-authorization-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-adoption-authorization-20260814
          fetch-depth: 0

      - name: Preserve bounded implementation outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-adoption
          cp .control/c3-adoption-authorization/adoption.py /tmp/starcom-c3-adoption/
          cp .control/c3-adoption-authorization/patch_test_fixture.py /tmp/starcom-c3-adoption/
          sha256sum /tmp/starcom-c3-adoption/*

      - name: Establish exact RED baseline and correct tamper fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-adoption-authorization 20b09cf0ec78297ca6b54da5017278804f56f1a3
          test "$(git rev-parse HEAD)" = "20b09cf0ec78297ca6b54da5017278804f56f1a3"
          grep -Fq 'RED seam for explicit C3 adoption authorization without execution' src/starcom/adoption.py
          python3 /tmp/starcom-c3-adoption/patch_test_fixture.py

      - name: Re-prove focused C3 adoption RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_adoption.py' -v > /tmp/starcom-c3-adoption/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c3-adoption/red.log
          test "$red_status" -ne 0
          grep -Fq 'Ran 12 tests' /tmp/starcom-c3-adoption/red.log
          grep -Fq 'FAILED (failures=1, errors=18)' /tmp/starcom-c3-adoption/red.log
          grep -Fq 'C3 adoption authorization is not implemented' /tmp/starcom-c3-adoption/red.log
          grep -Fq 'test_service_has_no_execution_method (test_adoption.C3AdoptionTests.test_service_has_no_execution_method) ... ok' /tmp/starcom-c3-adoption/red.log
          for test_name in \
            test_preparation_is_deterministic_and_binds_exact_authorization_context \
            test_default_deny_blocks_adoption_authorization \
            test_exact_authorization_creates_verified_not_executed_receipt \
            test_no_selection_decision_is_rejected \
            test_invalid_rollback_contracts_are_rejected \
            test_wrong_actor_resource_mission_or_context_is_rejected \
            test_authorization_and_adoption_chronology_is_enforced \
            test_second_adoption_and_authorization_reuse_are_rejected \
            test_transaction_rechecks_decision_and_trustplane \
            test_verifier_detects_row_rollback_consumption_and_ledger_tampering \
            test_later_qualification_evidence_makes_adoption_stale; do
            grep -Fq "$test_name" /tmp/starcom-c3-adoption/red.log
          done

      - name: Apply bounded adoption authority and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/starcom-c3-adoption/adoption.py src/starcom/adoption.py
          test "$(grep -c '^class C3AdoptionService:' src/starcom/adoption.py)" -eq 1
          test "$(grep -c '^    def execute' src/starcom/adoption.py || true)" -eq 0
          test "$(grep -c '^    def install' src/starcom/adoption.py || true)" -eq 0
          test "$(grep -c '^    def enable' src/starcom/adoption.py || true)" -eq 0
          test "$(grep -c '^    def deploy' src/starcom/adoption.py || true)" -eq 0
          test "$(grep -c '^    def run' src/starcom/adoption.py || true)" -eq 0
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_adoption.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_adoption.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 12:
              raise SystemExit(f'expected 12 adoption tests, found {focused}')
          if total != 208:
              raise SystemExit(f'expected 208 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_adoption.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: authorize C3 adoption without execution'
          git push origin 'HEAD:refs/heads/fix/c3-adoption-authorization'
          git rev-parse HEAD
