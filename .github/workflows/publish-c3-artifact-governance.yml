name: Publish verified STARCOM C3 artifact governance guard

on:
  push:
    branches:
      - control/c3-artifact-governance-20260814
    paths:
      - '.control/c3-artifact-governance/**'
      - '.github/workflows/publish-c3-artifact-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-artifact-governance-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-artifact-governance-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-governance
          cp .control/c3-artifact-governance/apply_patch.py /tmp/starcom-c3-governance/
          sha256sum /tmp/starcom-c3-governance/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-ungoverned-artifact-guard 35852d85bcff36f823ae35732fc703c2dcaa6658
          test "$(git rev-parse HEAD)" = "35852d85bcff36f823ae35732fc703c2dcaa6658"

      - name: Re-prove exact C3 governance RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_qualification_gate_governance.py' -v > /tmp/starcom-c3-governance/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c3-governance/red.log
          test "$red_status" -ne 0
          failures="$(grep -c '^FAIL:' /tmp/starcom-c3-governance/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-c3-governance/red.log || true)"
          test "$failures" -eq 2
          test "$errors" -eq 0
          grep -Fq 'test_c3_rejects_ungoverned_decision_artifact' /tmp/starcom-c3-governance/red.log
          grep -Fq 'test_c3_rejects_unauthorized_adoption_artifact' /tmp/starcom-c3-governance/red.log
          grep -Fq 'test_c3_allows_candidate_and_evaluation_artifacts (test_qualification_gate_governance.C3ArtifactGovernanceTests.test_c3_allows_candidate_and_evaluation_artifacts) ... ok' /tmp/starcom-c3-governance/red.log
          grep -Fq 'test_generic_lab_keeps_structural_decision_and_adoption_artifacts_valid (test_qualification_gate_governance.C3ArtifactGovernanceTests.test_generic_lab_keeps_structural_decision_and_adoption_artifacts_valid) ... ok' /tmp/starcom-c3-governance/red.log

      - name: Apply bounded guard and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-governance/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_qualification_gate_governance.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_qualification_gate_governance.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 4:
              raise SystemExit(f'expected 4 governance tests, found {focused}')
          if total != 176:
              raise SystemExit(f'expected 176 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_qualification_gate_governance.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix: fail C3 on ungoverned decision and adoption artifacts'
          git push origin 'HEAD:refs/heads/fix/c3-ungoverned-artifact-guard'
          git rev-parse HEAD
