name: Publish verified STARCOM C3 executor registry v4

on:
  push:
    branches:
      - control/c3-executor-registry-v4-20260814
    paths:
      - '.control/c3-executor-registry-v4/**'
      - '.github/workflows/publish-c3-executor-registry-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-executor-registry-v4-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-registry-v4-20260814
          fetch-depth: 0

      - name: Preserve v4 adapter and prototype material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-executor-registry-v4
          cp .control/c3-executor-registry-v4/adapt_v4.py \
            /tmp/starcom-c3-executor-registry-v4/
          git fetch origin control/c3-executor-registry-20260814
          git show \
            origin/control/c3-executor-registry-20260814:.control/c3-executor-registry/executor_registry.py \
            > /tmp/starcom-c3-executor-registry-v4/executor_registry.py
          git show \
            origin/control/c3-executor-registry-20260814:.control/c3-executor-registry/harden_verifier.py \
            > /tmp/starcom-c3-executor-registry-v4/harden_verifier.py
          git show \
            origin/control/c3-executor-registry-20260814:.control/c3-executor-registry/harden_idempotency.py \
            > /tmp/starcom-c3-executor-registry-v4/harden_idempotency.py
          sed -i \
            's#/tmp/starcom-c3-executor-registry/#/tmp/starcom-c3-executor-registry-v4/#g' \
            /tmp/starcom-c3-executor-registry-v4/harden_verifier.py \
            /tmp/starcom-c3-executor-registry-v4/harden_idempotency.py
          python3 /tmp/starcom-c3-executor-registry-v4/harden_verifier.py
          python3 /tmp/starcom-c3-executor-registry-v4/harden_idempotency.py
          python3 /tmp/starcom-c3-executor-registry-v4/adapt_v4.py
          sha256sum /tmp/starcom-c3-executor-registry-v4/*

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-executor-registry-v4 \
            82e3324fd76db0acb2cb414a0533d42b54e6f234
          test "$(git rev-parse HEAD)" = \
            "82e3324fd76db0acb2cb414a0533d42b54e6f234"
          test "$(git merge-base 3a8fd9c002f81a81886c86fc0460bc02dba54aef HEAD)" = \
            "3a8fd9c002f81a81886c86fc0460bc02dba54aef"
          grep -Fq 'RED seam for the signed, enabled and revocable C3 executor authority' \
            src/starcom/executor_registry.py

      - name: Re-prove exact registry RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          counts = {
              'registry': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_executor_registry.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_executor_registry_hardening.py'
              ).countTestCases(),
              'idempotency': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_executor_registry_idempotency.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          expected = {
              'registry': 9,
              'hardening': 7,
              'idempotency': 2,
              'total': 252,
          }
          print(counts)
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          for suite in \
            executor_registry \
            executor_registry_hardening \
            executor_registry_idempotency; do
            set +e
            python3 -m unittest discover -s tests -p "test_${suite}.py" -v \
              > "/tmp/starcom-c3-executor-registry-v4/red-${suite}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/starcom-c3-executor-registry-v4/red-${suite}.log"
            test "$status" -ne 0
            grep -Fq 'C3 executor registry v4 is not implemented' \
              "/tmp/starcom-c3-executor-registry-v4/red-${suite}.log"
            ! grep -Fq 'ImportError' \
              "/tmp/starcom-c3-executor-registry-v4/red-${suite}.log"
            ! grep -Fq 'ModuleNotFoundError' \
              "/tmp/starcom-c3-executor-registry-v4/red-${suite}.log"
          done
          grep -Fq 'Ran 9 tests' \
            /tmp/starcom-c3-executor-registry-v4/red-executor_registry.log
          grep -Fq 'Ran 7 tests' \
            /tmp/starcom-c3-executor-registry-v4/red-executor_registry_hardening.log
          grep -Fq 'Ran 2 tests' \
            /tmp/starcom-c3-executor-registry-v4/red-executor_registry_idempotency.log

      - name: Apply exact v4 registry and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/starcom-c3-executor-registry-v4/executor_registry.py \
            src/starcom/executor_registry.py
          test "$(grep -c '^class C3ExecutorRegistry:' src/starcom/executor_registry.py)" -eq 1
          ! grep -Fq 'C3 executor registry v4 is not implemented' \
            src/starcom/executor_registry.py
          grep -Fq 'reviewer_environment: str' src/starcom/executor_registry.py
          grep -Fq 'def get_qualifier_root' src/starcom/executor_registry.py
          grep -Fq 'def get_qualification' src/starcom/executor_registry.py
          grep -Fq 'C3_EXECUTOR_LEDGER_PAYLOAD_MISMATCH' \
            src/starcom/executor_registry.py
          python3 scripts/build_manifest.py --root . \
            --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry_hardening.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry_idempotency.py' -v
          python3 - <<'PY'
          import unittest
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={total}')
          if total != 252:
              raise SystemExit(f'expected 252 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover \
            -s tests -p 'test_executor_registry*.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: add exact signed and revocable C3 executor registry'
          git push origin 'HEAD:refs/heads/fix/c3-executor-registry-v4'
          git rev-parse HEAD
