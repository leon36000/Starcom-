name: STARCOM Issue 55 Task2 exact validation

on:
  push:
    branches:
      - chatgpt/validation-issue55-task2-13dc9c3f-20260819
  pull_request:
    branches:
      - main
    paths:
      - src/starcom/architecture_review.py
      - tests/test_architecture_review.py
      - tests/test_architecture_review_verification.py
      - tests/test_issue55_validation_snapshot.py
      - scripts/verify_issue55_task2.py
      - .github/workflows/issue55-task2-validation.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue55-task2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-task2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation snapshot
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile exact source and tests
        run: python -m compileall -q src tests scripts/verify_issue55_task2.py
      - name: Enforce repository policy gates
        run: |
          python -m unittest discover -s tests -p 'test_enforce_no_stubs.py' -v
          python -m unittest discover -s tests -p 'test_enforce_cli_boundary_imports.py' -v
          python -m unittest discover -s tests -p 'test_enforce_cli_output.py' -v
      - name: Classify Task2 and bounded Task3 failures
        id: classify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_issue55_task2.py 2>&1 | tee issue55_task2_classifier.log
      - name: Publish exact classifier summary on draft PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo '<!-- starcom-issue55-task2-validation -->'
            echo '## STARCOM Issue #55 Task2 — exact CI classification'
            echo
            echo "- Head: \`$HEAD_SHA\`"
            echo "- Classifier step outcome: \`${{ steps.classify.outcome }}\`"
            echo "- Run: $RUN_URL"
            echo
            echo '```json'
            if [ -f issue55_task2_summary.json ]; then
              cat issue55_task2_summary.json
            else
              echo '{"result":"HARNESS_ERROR","reason":"summary file missing","log_tail":['
              tail -n 80 issue55_task2_classifier.log | python -c 'import json,sys; print(",\n".join(json.dumps(line.rstrip("\n")) for line in sys.stdin))'
              echo ']}'
            fi
            echo '```'
            echo
            echo '**Validation only — do not merge.** This comment is CI evidence for the isolated Task2 gate, not product adoption, deployment, certification, or promotion.'
          } > issue55_task2_comment.md
          gh pr comment "$PR_NUMBER" --body-file issue55_task2_comment.md
      - name: Enforce exact Task2 classifier result
        if: always()
        shell: bash
        run: test "${{ steps.classify.outcome }}" = "success"
