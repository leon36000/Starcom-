name: Publish hardened STARCOM C3 executor registry v4 authority

on:
  push:
    branches:
      - control/c3-executor-registry-v4-authority-hardening-20260814
    paths:
      - '.control/c3-executor-registry-v4-authority-hardening/**'
      - '.github/workflows/publish-c3-executor-registry-v4-authority-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-executor-registry-v4-authority-hardening
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-registry-v4-authority-hardening-20260814
          fetch-depth: 0

      - name: Preserve bounded hardening patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-registry-hardening
          cp .control/c3-executor-registry-v4-authority-hardening/apply_patch.py \
            /tmp/starcom-c3-registry-hardening/
          sha256sum /tmp/starcom-c3-registry-hardening/apply_patch.py

      - name: Establish exact independent-review RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-executor-registry-v4-hardened \
            f2116ba371190760a4a8d452bc225902b835bcfc
          test "$(git rev-parse HEAD)" = \
            "f2116ba371190760a4a8d452bc225902b835bcfc"
          test "$(git rev-parse HEAD^)" = \
            "1b9dcd2c4b3b86a1ee588f669bae3f6a1b4e0756"
          test -f tests/test_executor_registry_authority_hardening.py
          ! grep -Fq 'def _qualifier_root_defects' src/starcom/executor_registry.py

      - name: Re-prove exact authority-hardening RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_executor_registry_authority_hardening.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 7:
              raise SystemExit(f'expected 7 authority-hardening tests, found {focused}')
          if total != 259:
              raise SystemExit(f'expected 259 tests, found {total}')
          PY
          set +e
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry_authority_hardening.py' -v \
            > /tmp/starcom-c3-registry-hardening/red.log 2>&1
          status=$?
          set -e
          cat /tmp/starcom-c3-registry-hardening/red.log
          test "$status" -ne 0
          grep -Fq 'Ran 7 tests' /tmp/starcom-c3-registry-hardening/red.log
          grep -Fq 'FAILED (failures=7)' \
            /tmp/starcom-c3-registry-hardening/red.log
          test "$(grep -c '^FAIL:' /tmp/starcom-c3-registry-hardening/red.log || true)" -eq 7
          test "$(grep -c '^ERROR:' /tmp/starcom-c3-registry-hardening/red.log || true)" -eq 0
          for test_name in \
            test_exact_qualifier_root_replay_reverifies_existing_authority \
            test_qualification_rejects_dirty_qualifier_root_before_signature_trust \
            test_enable_rejects_dirty_qualification_authority \
            test_exact_enable_replay_reverifies_existing_registry \
            test_verifier_detects_descriptor_row_provenance_tampering \
            test_verifier_detects_qualification_row_provenance_tampering \
            test_verifier_checks_exact_qualifier_root_event_payload; do
            grep -Fq "$test_name" /tmp/starcom-c3-registry-hardening/red.log
          done

      - name: Apply bounded authority hardening and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-registry-hardening/apply_patch.py
          grep -Fq 'def _qualifier_root_defects' src/starcom/executor_registry.py
          grep -Fq 'C3_EXECUTOR_DESCRIPTOR_PROVENANCE_MISMATCH' \
            src/starcom/executor_registry.py
          grep -Fq 'C3_EXECUTOR_QUALIFICATION_PROVENANCE_MISMATCH' \
            src/starcom/executor_registry.py
          grep -Fq 'C3_EXECUTOR_DECISION_REQUEST_MISMATCH' \
            src/starcom/executor_registry.py
          python3 scripts/build_manifest.py --root . \
            --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry_authority_hardening.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_executor_registry*.py' -v
          python3 - <<'PY'
          import unittest
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={total}')
          if total != 259:
              raise SystemExit(f'expected 259 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover \
            -s tests -p 'test_executor_registry*.py'
          git add -A
          git diff --cached --check

      - name: Publish verified hardened feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix: harden C3 executor registry authority rechecks'
          git push origin 'HEAD:refs/heads/fix/c3-executor-registry-v4-hardened'
          git rev-parse HEAD
