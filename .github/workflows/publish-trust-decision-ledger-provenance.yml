name: Publish verified TrustPlane decision ledger provenance

on:
  push:
    branches:
      - control/trust-decision-ledger-provenance-20260813
    paths:
      - '.control/trust-decision-ledger-provenance/**'
      - '.github/workflows/publish-trust-decision-ledger-provenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-trust-decision-provenance-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/trust-decision-ledger-provenance-20260813
          fetch-depth: 0

      - name: Preserve bounded patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-trust-provenance
          cp .control/trust-decision-ledger-provenance/apply_patch.py /tmp/starcom-trust-provenance/
          sha256sum /tmp/starcom-trust-provenance/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git switch -C fix/trust-decision-ledger-provenance 682a9aa6cff3c0a4eef08e84c9577a903be0e071
          test "$(git rev-parse HEAD)" = "682a9aa6cff3c0a4eef08e84c9577a903be0e071"

      - name: Re-prove four TrustPlane provenance tests RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_trust.py' -v > /tmp/starcom-trust-provenance/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-trust-provenance/red.log
          test "$red_status" -ne 0
          for test_name in \
            test_verifier_rejects_wrong_decision_ledger_kind \
            test_verifier_rejects_cross_stream_decision_repointing \
            test_verifier_rejects_wrong_decision_ledger_actor \
            test_verifier_rejects_wrong_decision_ledger_timestamp; do
            grep -Fq "$test_name" /tmp/starcom-trust-provenance/red.log
          done
          failures="$(grep -c '^FAIL:' /tmp/starcom-trust-provenance/red.log || true)"
          test "$failures" -eq 4

      - name: Apply bounded TrustPlane fix and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-trust-provenance/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and full repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_trust.py' -v
          python3 - <<'PY'
          import unittest
          count = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={count}')
          if count != 83:
              raise SystemExit(f'expected 83 tests, found {count}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git commit -m 'fix: bind TrustPlane decisions to canonical ledger provenance'
          git push origin 'HEAD:refs/heads/fix/trust-decision-ledger-provenance'
          git rev-parse HEAD
