name: Publish verified C1 plus TrustPlane hardening integration

on:
  push:
    branches:
      - control/c1-integrate-main-trust-hardening-20260813
    paths:
      - '.github/workflows/publish-c1-integrated-trust-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c1-trust-integration-publication
  cancel-in-progress: false

jobs:
  integrate-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c1-integrate-main-trust-hardening-20260813
          fetch-depth: 0

      - name: Establish exact C1 hardened base
        shell: bash
        run: |
          set -euo pipefail
          git switch -C fix/c1-trust-root-event-binding 0b13b92989dfcefc8a0417dbd2a0a13984833641
          test "$(git rev-parse HEAD)" = "0b13b92989dfcefc8a0417dbd2a0a13984833641"
          test "$(git rev-parse origin/main)" = "e0d0b03b9071941181b54da83ad364e602f096bd"

      - name: Merge verified main hardening with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts=%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "MANIFEST.sha256" ]; then
              echo 'Unexpected merge conflict; refusing integration.' >&2
              exit 1
            fi
            git checkout --ours MANIFEST.sha256
            git add MANIFEST.sha256
          fi
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write
          git add MANIFEST.sha256
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Verify exact combined state
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          count = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={count}')
          if count != 97:
              raise SystemExit(f'expected 97 combined tests, found {count}')
          PY
          python3 -m unittest discover -s tests -p 'test_continuity_verification.py' -v
          python3 -m unittest discover -s tests -p 'test_trust.py' -v
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Commit and publish verified integration to C1 PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git commit -m 'chore: integrate verified TrustPlane hardening into C1 verifier'
          git push origin 'HEAD:refs/heads/fix/c1-trust-root-event-binding'
          git rev-parse HEAD
