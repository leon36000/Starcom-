name: Publish verified STARCOM C2 census CLI

on:
  push:
    branches:
      - control/c2-census-cli-20260814
    paths:
      - '.control/c2-census-cli/**'
      - '.github/workflows/publish-c2-census-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-census-cli-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c2-census-cli-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-census-cli
          cp .control/c2-census-cli/apply_patch.py /tmp/starcom-census-cli/
          sha256sum /tmp/starcom-census-cli/apply_patch.py

      - name: Establish exact corrected RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-census-cli f9a8326ba603fab7c179850e57da86acfb9f2b2d
          test "$(git rev-parse HEAD)" = "f9a8326ba603fab7c179850e57da86acfb9f2b2d"

      - name: Re-prove Census CLI contract RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_census_cli.py' -v > /tmp/starcom-census-cli/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-census-cli/red.log
          test "$red_status" -ne 0
          for test_name in \
            test_explicit_evidence_can_register_get_verify_and_assess_below_target \
            test_mismatched_source_is_rejected_without_creating_identity \
            test_register_never_creates_upstream_evidence_implicitly; do
            grep -Fq "$test_name" /tmp/starcom-census-cli/red.log
          done
          failures="$(grep -c '^FAIL:' /tmp/starcom-census-cli/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-census-cli/red.log || true)"
          test "$failures" -eq 3
          test "$errors" -eq 0
          grep -Fq "invalid choice: 'census'" /tmp/starcom-census-cli/red.log

      - name: Apply thin Census CLI and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-census-cli/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_census_cli.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_census_cli.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 3:
              raise SystemExit(f'expected 3 Census CLI tests, found {focused}')
          if total != 129:
              raise SystemExit(f'expected 129 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: expose evidence-bound C2 census CLI'
          git push origin 'HEAD:refs/heads/fix/c2-census-cli'
          git rev-parse HEAD
