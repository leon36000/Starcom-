name: Publish hardened STARCOM C3 worker rollback authority

on:
  push:
    branches:
      - control/c3-executor-worker-attestation-v2-rollback-hardening-20260814
    paths:
      - '.control/c3-executor-worker-attestation-v2-rollback-hardening/**'
      - '.github/workflows/publish-c3-executor-worker-attestation-v2-rollback-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-worker-rollback-authority-hardening
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-worker-attestation-v2-rollback-hardening-20260814
          fetch-depth: 0

      - name: Preserve bounded hardening patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-worker-rollback-hardening
          cp .control/c3-executor-worker-attestation-v2-rollback-hardening/apply_patch.py \
            /tmp/starcom-c3-worker-rollback-hardening/
          sha256sum /tmp/starcom-c3-worker-rollback-hardening/apply_patch.py

      - name: Establish exact independent-review RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-executor-worker-attestation-v2-hardened \
            aa53b9b5144f2fc575256c77b36e3ab7b673820d
          test "$(git rev-parse HEAD)" = \
            "aa53b9b5144f2fc575256c77b36e3ab7b673820d"
          test "$(git rev-parse HEAD^)" = \
            "aa0224bf81f1f72cd0a743b55dc7409faef617b3"
          test -f tests/test_executor_worker_attestation_rollback_hardening.py
          ! grep -Fq 'def _registry_allows_compensating_rollback' \
            src/starcom/adoption_execution.py

      - name: Re-prove exact rollback-authority RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests',
              pattern='test_executor_worker_attestation_rollback_hardening.py',
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 2:
              raise SystemExit(f'expected 2 rollback-authority tests, found {focused}')
          if total != 273:
              raise SystemExit(f'expected 273 tests, found {total}')
          PY
          set +e
          python3 -m unittest discover -s tests \
            -p 'test_executor_worker_attestation_rollback_hardening.py' -v \
            > /tmp/starcom-c3-worker-rollback-hardening/red.log 2>&1
          status=$?
          set -e
          cat /tmp/starcom-c3-worker-rollback-hardening/red.log
          test "$status" -ne 0
          grep -Fq 'Ran 2 tests' \
            /tmp/starcom-c3-worker-rollback-hardening/red.log
          grep -Fq 'FAILED (failures=2)' \
            /tmp/starcom-c3-worker-rollback-hardening/red.log
          test "$(grep -c '^FAIL:' /tmp/starcom-c3-worker-rollback-hardening/red.log || true)" -eq 2
          test "$(grep -c '^ERROR:' /tmp/starcom-c3-worker-rollback-hardening/red.log || true)" -eq 0
          grep -Fq 'test_wrong_version_cannot_receive_compensating_rollback' \
            /tmp/starcom-c3-worker-rollback-hardening/red.log
          grep -Fq 'test_dirty_registry_cannot_authorize_compensating_rollback' \
            /tmp/starcom-c3-worker-rollback-hardening/red.log

      - name: Apply bounded rollback authority hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-worker-rollback-hardening/apply_patch.py
          grep -Fq 'def _registry_allows_compensating_rollback' \
            src/starcom/adoption_execution.py
          test "$(grep -c 'self._registry_allows_compensating_rollback(request)' src/starcom/adoption_execution.py)" -eq 1
          python3 scripts/build_manifest.py --root . \
            --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_executor_worker_attestation_rollback_hardening.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_executor_worker_attestation.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_adoption_execution.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_adoption_execution_hardening.py' -v
          python3 - <<'PY'
          import unittest
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={total}')
          if total != 273:
              raise SystemExit(f'expected 273 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover \
            -s tests -p 'test_*execution*.py'
          git add -A
          git diff --cached --check

      - name: Publish verified hardened feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix: restrict C3 compensating rollback to trusted executor material'
          git push origin 'HEAD:refs/heads/fix/c3-executor-worker-attestation-v2-hardened'
          git rev-parse HEAD
