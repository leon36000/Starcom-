name: Publish verified STARCOM C2 recollection gate

on:
  push:
    branches:
      - control/c2-recollection-gate-20260814
    paths:
      - '.control/c2-recollection-gate/**'
      - '.github/workflows/publish-c2-recollection-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-recollection-gate-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c2-recollection-gate-20260814
          fetch-depth: 0

      - name: Preserve and normalize bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c2-gate
          cp .control/c2-recollection-gate/apply_patch.py /tmp/starcom-c2-gate/
          python3 .control/c2-recollection-gate/normalize_patch.py
          sha256sum /tmp/starcom-c2-gate/apply_patch.py

      - name: Establish exact strengthened RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-recollection-gate ae7b951d599213684669268e968b5eb7e9406baa
          test "$(git rev-parse HEAD)" = "ae7b951d599213684669268e968b5eb7e9406baa"

      - name: Re-prove C2 gate contract RED with published-C1 fixture proof
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_recollection.py' -v > /tmp/starcom-c2-gate/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c2-gate/red.log
          test "$red_status" -ne 0
          grep -Fq 'test_generic_research_remains_available_before_c1' /tmp/starcom-c2-gate/red.log
          grep -Fq 'test_start_blocks_before_c1_recovery_publication' /tmp/starcom-c2-gate/red.log
          grep -Fq 'test_clean_c1_can_start_idempotent_verified_recollection' /tmp/starcom-c2-gate/red.log
          failures="$(grep -c '^FAIL:' /tmp/starcom-c2-gate/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-c2-gate/red.log || true)"
          test "$failures" -eq 2
          test "$errors" -eq 5
          grep -Fq 'test_generic_research_remains_available_before_c1 (test_recollection.C2RecollectionGateTests.test_generic_research_remains_available_before_c1) ... ok' /tmp/starcom-c2-gate/red.log
          if grep -Fq 'AssertionError: <IncidentStatus.RECOVERY_REQUIRED' /tmp/starcom-c2-gate/red.log; then
            echo 'C1 fixture did not reach published state; refusing production patch.' >&2
            exit 1
          fi

      - name: Apply bounded C2 gate and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-gate/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_recollection.py' -v
          python3 - <<'PY'
          import unittest
          count = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={count}')
          if count != 107:
              raise SystemExit(f'expected 107 tests, found {count}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: gate Task 5 C2 recollection on verified C1 recovery'
          git push origin 'HEAD:refs/heads/fix/c2-recollection-gate'
          git rev-parse HEAD
