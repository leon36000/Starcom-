name: Publish verified STARCOM C3 signed decision authority

on:
  push:
    branches:
      - control/c3-signed-decision-20260814
    paths:
      - '.control/c3-signed-decision/**'
      - '.github/workflows/publish-c3-signed-decision.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-signed-decision-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-signed-decision-20260814
          fetch-depth: 0

      - name: Preserve bounded implementation outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-decision
          cp .control/c3-signed-decision/qualification_decision.py /tmp/starcom-c3-decision/
          sha256sum /tmp/starcom-c3-decision/qualification_decision.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-signed-decision d4d45fc984f28f01ebc9f91bfa6fcba436e5448c
          test "$(git rev-parse HEAD)" = "d4d45fc984f28f01ebc9f91bfa6fcba436e5448c"
          grep -Fq 'RED seam for the sovereign exact-byte C3 decision authority' src/starcom/qualification_decision.py

      - name: Re-prove focused C3 decision RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_qualification_decision.py' -v > /tmp/starcom-c3-decision/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c3-decision/red.log
          test "$red_status" -ne 0
          grep -Fq 'Ran 11 tests' /tmp/starcom-c3-decision/red.log
          grep -Fq 'FAILED (errors=16)' /tmp/starcom-c3-decision/red.log
          test "$(grep -c '^FAIL:' /tmp/starcom-c3-decision/red.log || true)" -eq 0
          grep -Fq 'C3 decision authority is not implemented' /tmp/starcom-c3-decision/red.log
          for test_name in \
            test_snapshot_is_deterministic_and_binds_candidate_evaluation_sets \
            test_exact_signed_selection_is_admitted_verified_and_idempotent \
            test_exact_signed_no_selection_is_valid \
            test_decision_requires_candidate_and_evaluation_evidence \
            test_selected_candidate_must_belong_to_snapshot \
            test_modified_payload_or_signature_is_rejected \
            test_decision_maker_must_be_independent_and_after_latest_evidence \
            test_second_decision_for_same_c3_run_is_rejected \
            test_snapshot_is_rechecked_inside_admission_transaction \
            test_verifier_detects_membership_and_decision_ledger_tampering \
            test_later_qualification_evidence_makes_decision_stale; do
            grep -Fq "$test_name" /tmp/starcom-c3-decision/red.log
          done

      - name: Apply bounded decision authority and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/starcom-c3-decision/qualification_decision.py src/starcom/qualification_decision.py
          test "$(grep -c '^class C3DecisionService:' src/starcom/qualification_decision.py)" -eq 1
          sed -i 's/[[:space:]]\+$//' docs/superpowers/specs/2026-08-14-c3-signed-decision-design.md
          test -z "$(grep -n '[[:space:]]$' docs/superpowers/specs/2026-08-14-c3-signed-decision-design.md || true)"
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_qualification_decision.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_qualification_decision.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 11:
              raise SystemExit(f'expected 11 C3 decision tests, found {focused}')
          if total != 187:
              raise SystemExit(f'expected 187 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_qualification_decision.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: add exact-byte signed C3 decision authority'
          git push origin 'HEAD:refs/heads/fix/c3-signed-decision'
          git rev-parse HEAD
