name: Reconcile STARCOM C3 executor registry v3

on:
  push:
    branches:
      - control/c3-executor-registry-v3-reconcile-20260814
    paths:
      - '.github/workflows/reconcile-c3-executor-registry-v3.yml'
      - '.control/c3-executor-registry-v3-reconcile/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-main-integration
  cancel-in-progress: false

jobs:
  reconcile-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-registry-v3-reconcile-20260814
          fetch-depth: 0

      - name: Freeze main and v3 feature
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git fetch origin main fix/c3-executor-registry-v3 || true
          base="$(git rev-parse origin/main)"
          feature="$(git rev-parse origin/fix/c3-executor-registry-v3 2>/dev/null || true)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          git switch -C reconcile/c3-executor-registry-v3 "$base"
          if test -f tests/test_executor_registry_idempotency.py \
             && test -f src/starcom/executor_registry.py \
             && grep -Fq 'revoked executor replay conflicts with terminal material' src/starcom/executor_registry.py; then
            echo "mode=already-integrated" >> "$GITHUB_OUTPUT"
          else
            test -n "$feature"
            git merge --no-ff --no-edit "$feature"
            echo "mode=merge-feature" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify v3 registry completely
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          test -f src/starcom/executor_registry.py
          test -f tests/test_executor_registry.py
          test -f tests/test_executor_registry_hardening.py
          test -f tests/test_executor_registry_idempotency.py
          ! grep -Fq 'C3 executor registry is not implemented' src/starcom/executor_registry.py
          python3 - <<'PY'
          import unittest
          counts = {
              'registry': unittest.defaultTestLoader.discover('tests', pattern='test_executor_registry.py').countTestCases(),
              'hardening': unittest.defaultTestLoader.discover('tests', pattern='test_executor_registry_hardening.py').countTestCases(),
              'idempotency': unittest.defaultTestLoader.discover('tests', pattern='test_executor_registry_idempotency.py').countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          expected = {'registry': 9, 'hardening': 7, 'idempotency': 2, 'total': 252}
          print(counts)
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          python3 -m unittest discover -s tests -p 'test_executor_registry*.py' -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_executor_registry*.py'
          git diff '${{ steps.refs.outputs.base }}'..HEAD --check

      - name: Recheck refs and publish merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/c3-executor-registry-v3 || true
          test "$(git rev-parse origin/main)" = '${{ steps.refs.outputs.base }}'
          if test '${{ steps.refs.outputs.mode }}' = 'merge-feature'; then
            test "$(git rev-parse origin/fix/c3-executor-registry-v3)" = '${{ steps.refs.outputs.feature }}'
            git push origin 'HEAD:refs/heads/main'
          else
            test "$(git rev-parse HEAD)" = '${{ steps.refs.outputs.base }}'
            echo 'verified C3 executor registry v3 is already integrated'
          fi
          git rev-parse HEAD
