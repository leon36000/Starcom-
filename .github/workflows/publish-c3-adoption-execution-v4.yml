name: Publish corrected STARCOM C3 adoption execution authority v4

on:
  push:
    branches:
      - control/c3-adoption-execution-v4-20260814
    paths:
      - '.control/c3-adoption-execution-v4/**'
      - '.github/workflows/publish-c3-adoption-execution-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-adoption-execution-publication-v4
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-adoption-execution-v4-20260814
          fetch-depth: 0

      - name: Preserve bounded implementation outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-execution-v4
          cp .control/c3-adoption-execution-v4/materialize_adoption_execution.py /tmp/starcom-c3-execution-v4/
          cp .control/c3-adoption-execution-v4/patch_durable.py /tmp/starcom-c3-execution-v4/
          cp .control/c3-adoption-execution-v4/patch_tests.py /tmp/starcom-c3-execution-v4/
          python3 /tmp/starcom-c3-execution-v4/materialize_adoption_execution.py
          sha256sum /tmp/starcom-c3-execution-v4/*

      - name: Freeze exact main and RED branch
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git fetch origin main agent/c3-adoption-execution
          base="$(git rev-parse origin/main)"
          head="$(git rev-parse origin/agent/c3-adoption-execution)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base"
          echo "head=$head"
          test "$base" = "f20b1ba6d4e78c990c6ee6df2b19a157127b3c44"
          test "$head" = "4c741a584f01f5bc284c7dd8d5ba5ac06ac77f0d"
          test "$(git merge-base "$base" "$head")" = "$base"
          git switch -C fix/c3-adoption-execution-v4 "$head"
          test -f src/starcom/adoption_execution.py
          test -f tests/test_durable_transaction.py
          test -f tests/test_adoption_execution.py
          test -f tests/test_adoption_execution_hardening.py
          grep -Fq 'RED seam for separately authorized durable adoption execution' src/starcom/adoption_execution.py

      - name: Re-prove causal RED against authoritative durable API
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          counts = {
              'durable': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_durable_transaction.py'
              ).countTestCases(),
              'execution': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_hardening.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          expected = {'durable': 2, 'execution': 10, 'hardening': 6, 'total': 230}
          print(counts)
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          for suite in durable_transaction adoption_execution adoption_execution_hardening; do
            set +e
            python3 -m unittest discover -s tests -p "test_${suite}.py" -v \
              > "/tmp/starcom-c3-execution-v4/red-${suite}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/starcom-c3-execution-v4/red-${suite}.log"
            test "$status" -ne 0
          done
          grep -Fq 'enqueue_in_transaction' \
            /tmp/starcom-c3-execution-v4/red-durable_transaction.log
          grep -Fq 'C3 adoption execution is not implemented' \
            /tmp/starcom-c3-execution-v4/red-adoption_execution.log
          grep -Fq 'C3 adoption execution is not implemented' \
            /tmp/starcom-c3-execution-v4/red-adoption_execution_hardening.log
          grep -Fq 'Ran 2 tests' \
            /tmp/starcom-c3-execution-v4/red-durable_transaction.log
          grep -Fq 'Ran 10 tests' \
            /tmp/starcom-c3-execution-v4/red-adoption_execution.log
          grep -Fq 'Ran 6 tests' \
            /tmp/starcom-c3-execution-v4/red-adoption_execution_hardening.log

      - name: Apply bounded durable API and C3 execution implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-execution-v4/patch_durable.py
          python3 /tmp/starcom-c3-execution-v4/patch_tests.py
          cp /tmp/starcom-c3-execution-v4/adoption_execution.py \
            src/starcom/adoption_execution.py
          test "$(grep -c '^    def enqueue_in_transaction(' src/starcom/durable.py)" -eq 1
          test "$(grep -c '^class C3AdoptionExecutionService:' src/starcom/adoption_execution.py)" -eq 1
          test "$(grep -c '^class C3AdoptionExecutionWorker:' src/starcom/adoption_execution.py)" -eq 1
          test "$(grep -c '^class DisabledC3AdoptionExecutor:' src/starcom/adoption_execution.py)" -eq 1
          ! grep -Fq 'C3 adoption execution is not implemented' src/starcom/adoption_execution.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_durable_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution_hardening.py' -v
          python3 - <<'PY'
          import unittest
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={total}')
          if total != 230:
              raise SystemExit(f'expected 230 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover \
            -s tests -p 'test_adoption_execution*.py'
          git add -A
          git diff --cached --check

      - name: Recheck immutable refs and publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/c3-adoption-execution
          test "$(git rev-parse origin/main)" = '${{ steps.refs.outputs.base }}'
          test "$(git rev-parse origin/agent/c3-adoption-execution)" = '${{ steps.refs.outputs.head }}'
          git commit -m 'feat: add corrected durable C3 adoption execution authority'
          git push origin 'HEAD:refs/heads/fix/c3-adoption-execution-v4'
          git rev-parse HEAD
