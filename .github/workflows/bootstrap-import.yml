name: STARCOM one-shot verified bootstrap import

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/r0.1-proof-gated-core
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

concurrency:
  group: starcom-bootstrap-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decode and safely extract sealed source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.bootstrap/source.b64.*)
          if (( ${#chunks[@]} == 0 )); then
            echo 'No bootstrap chunks found' >&2
            exit 20
          fi
          cat "${chunks[@]}" > /tmp/starcom-source.b64
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = Path('/tmp/starcom-source.b64').read_bytes()
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid base64 bootstrap payload: {exc}')

          payload_path = Path('/tmp/starcom-source.tar.gz')
          payload_path.write_bytes(payload)
          print(json.dumps({'payload_sha256': hashlib.sha256(payload).hexdigest(), 'payload_bytes': len(payload)}))

          extract_root = Path('/tmp/starcom-safe-extract')
          if extract_root.exists():
              shutil.rmtree(extract_root)
          extract_root.mkdir(parents=True)

          total = 0
          with tarfile.open(payload_path, mode='r:*') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('empty source archive')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  total += max(member.size, 0)
                  if total > 100 * 1024 * 1024:
                      raise SystemExit('archive exceeds 100 MiB uncompressed limit')
              archive.extractall(extract_root, members=members, filter='data')

          children = list(extract_root.iterdir())
          source_root = children[0] if len(children) == 1 and children[0].is_dir() else extract_root
          required = [source_root / 'pyproject.toml', source_root / 'src' / 'starcom', source_root / 'scripts' / 'verify_repo.py']
          missing = [str(p.relative_to(source_root)) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'bootstrap archive lacks required paths: {missing}')

          destination = Path.cwd()
          protected = {'.git', '.bootstrap'}
          for child in source_root.iterdir():
              if child.name in protected:
                  continue
              target = destination / child.name
              if target.exists():
                  if target.is_dir() and not target.is_symlink():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
              if child.is_dir():
                  shutil.copytree(child, target)
              else:
                  shutil.copy2(child, target)
          PY

      - name: Remove bootstrap transport before verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Verify imported repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 scripts/verify_repo.py
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q src tests scripts

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Bootstrap Bot'
          git config user.email 'starcom-bootstrap-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No import changes to commit.'
            exit 0
          fi
          git commit -m 'bootstrap: import verified R0.1 proof-gated mission core'
          git push origin "HEAD:${GITHUB_REF_NAME}"
