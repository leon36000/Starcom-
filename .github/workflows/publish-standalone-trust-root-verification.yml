name: Publish verified standalone continuity trust-root authority

on:
  push:
    branches:
      - control/standalone-trust-root-verification-20260814
    paths:
      - '.control/standalone-trust-root-verification/**'
      - '.github/workflows/publish-standalone-trust-root-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-standalone-trust-root-verification-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/standalone-trust-root-verification-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-trust-root
          cp .control/standalone-trust-root-verification/apply_patch.py /tmp/starcom-trust-root/
          sha256sum /tmp/starcom-trust-root/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/standalone-trust-root-verification e6ff9a41698ee13cb4a223684c95642abd8f643c
          test "$(git rev-parse HEAD)" = "e6ff9a41698ee13cb4a223684c95642abd8f643c"

      - name: Re-prove isolated trust-root verifier RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_trust_root_verification.py' -v > /tmp/starcom-trust-root/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-trust-root/red.log
          test "$red_status" -ne 0
          errors="$(grep -c '^ERROR:' /tmp/starcom-trust-root/red.log || true)"
          failures="$(grep -c '^FAIL:' /tmp/starcom-trust-root/red.log || true)"
          test "$errors" -eq 12
          test "$failures" -eq 0
          grep -Fq "object has no attribute 'verify_trust_root'" /tmp/starcom-trust-root/red.log

      - name: Apply authority extraction and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-trust-root/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_trust_root_verification.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_trust_root_verification.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 12:
              raise SystemExit(f'expected 12 trust-root tests, found {focused}')
          if total != 141:
              raise SystemExit(f'expected 141 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'refactor: extract standalone continuity trust-root verification'
          git push origin 'HEAD:refs/heads/fix/standalone-trust-root-verification'
          git rev-parse HEAD
