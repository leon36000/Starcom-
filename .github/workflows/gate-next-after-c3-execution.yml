name: Gate next STARCOM work after hardened C3 execution

on:
  push:
    branches:
      - control/c3-execution-next-gate-20260814
    paths:
      - '.github/workflows/gate-next-after-c3-execution.yml'
      - '.control/c3-execution-next-gate/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-next-work-gate
  cancel-in-progress: false

jobs:
  verify-main-and-create-next-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-execution-next-gate-20260814
          fetch-depth: 0

      - name: Freeze and checkout current main
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main="$(git rev-parse origin/main)"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          git switch -C gate/c3-execution-next "$main"
          test -f src/starcom/adoption_execution.py
          ! grep -Fq 'C3 adoption execution is not implemented' src/starcom/adoption_execution.py
          test -f tests/test_durable_transaction.py
          test -f tests/test_adoption_execution.py
          test -f tests/test_adoption_execution_hardening.py

      - name: Verify hardened main completely
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          counts = {
              'durable': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_durable_transaction.py'
              ).countTestCases(),
              'execution': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_hardening.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          print(counts)
          expected = {'durable': 2, 'execution': 10, 'hardening': 6, 'total': 230}
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          python3 -m unittest discover -s tests -p 'test_durable_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution_hardening.py' -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_adoption_execution*.py'

      - name: Recheck main and create immutable next branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '${{ steps.refs.outputs.main }}'
          if git ls-remote --exit-code --heads origin agent/c3-adoption-execution-cli >/dev/null 2>&1; then
            remote="$(git ls-remote --heads origin agent/c3-adoption-execution-cli | awk '{print $1}')"
            test "$remote" = '${{ steps.refs.outputs.main }}'
            echo 'next branch already exists at the verified main SHA'
          else
            git push origin 'HEAD:refs/heads/agent/c3-adoption-execution-cli'
          fi
          echo "verified_main=${{ steps.refs.outputs.main }}"
