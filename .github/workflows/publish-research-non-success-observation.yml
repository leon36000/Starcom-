name: Publish verified research non-success observation guard

on:
  push:
    branches:
      - control/research-non-success-observation-20260814
    paths:
      - '.control/research-non-success-observation/**'
      - '.github/workflows/publish-research-non-success-observation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-research-non-success-observation-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/research-non-success-observation-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-research-verifier
          cp .control/research-non-success-observation/apply_patch.py /tmp/starcom-research-verifier/
          sha256sum /tmp/starcom-research-verifier/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/research-non-success-observation-verifier dcebf7e8709a5670b46cad68e4b813df50976398
          test "$(git rev-parse HEAD)" = "dcebf7e8709a5670b46cad68e4b813df50976398"

      - name: Re-prove isolated verifier RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_research.py' -v > /tmp/starcom-research-verifier/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-research-verifier/red.log
          test "$red_status" -ne 0
          grep -Fq 'test_verifier_rejects_observation_on_non_success_attempt' /tmp/starcom-research-verifier/red.log
          failures="$(grep -c '^FAIL:' /tmp/starcom-research-verifier/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-research-verifier/red.log || true)"
          test "$failures" -eq 1
          test "$errors" -eq 0
          grep -Fq 'AssertionError: True is not false' /tmp/starcom-research-verifier/red.log

      - name: Apply minimal verifier patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-research-verifier/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_research.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_research.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 13:
              raise SystemExit(f'expected 13 research tests, found {focused}')
          if total != 126:
              raise SystemExit(f'expected 126 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix: reject observations on non-success research attempts'
          git push origin 'HEAD:refs/heads/fix/research-non-success-observation-verifier'
          git rev-parse HEAD
