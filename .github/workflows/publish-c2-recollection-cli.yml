name: Publish verified STARCOM C2 recollection CLI

on:
  push:
    branches:
      - control/c2-recollection-cli-20260814
    paths:
      - '.control/c2-recollection-cli/**'
      - '.github/workflows/publish-c2-recollection-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-recollection-cli-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c2-recollection-cli-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c2-cli
          cp .control/c2-recollection-cli/apply_patch.py /tmp/starcom-c2-cli/
          sha256sum /tmp/starcom-c2-cli/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-recollection-cli c8f0723d9f8e52e7272ebc7fcf370d8d36cc2bd6
          test "$(git rev-parse HEAD)" = "c8f0723d9f8e52e7272ebc7fcf370d8d36cc2bd6"

      - name: Re-prove C2 CLI contract RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_recollection_cli.py' -v > /tmp/starcom-c2-cli/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c2-cli/red.log
          test "$red_status" -ne 0
          for test_name in \
            test_start_is_blocked_before_c1_publication \
            test_published_c1_can_start_get_and_verify_c2 \
            test_target_below_800_is_rejected_without_binding; do
            grep -Fq "$test_name" /tmp/starcom-c2-cli/red.log
          done
          failures="$(grep -c '^FAIL:' /tmp/starcom-c2-cli/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-c2-cli/red.log || true)"
          test "$failures" -eq 3
          test "$errors" -eq 0
          grep -Fq "invalid choice: 'recollection'" /tmp/starcom-c2-cli/red.log

      - name: Apply thin CLI patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-cli/apply_patch.py
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and full repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_recollection_cli.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_recollection_cli.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 3:
              raise SystemExit(f'expected 3 C2 CLI tests, found {focused}')
          if total != 115:
              raise SystemExit(f'expected 115 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: expose verified C2 recollection CLI'
          git push origin 'HEAD:refs/heads/fix/c2-recollection-cli'
          git rev-parse HEAD
