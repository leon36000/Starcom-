name: Publish verified STARCOM registry-attested C3 worker v2

on:
  push:
    branches:
      - control/c3-executor-worker-attestation-v2-20260814
    paths:
      - '.control/c3-executor-worker-attestation-v2/**'
      - '.github/workflows/publish-c3-executor-worker-attestation-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-executor-worker-attestation-v2-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-worker-attestation-v2-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-worker-attestation-v2
          cp .control/c3-executor-worker-attestation-v2/apply_patch.py \
            /tmp/starcom-c3-worker-attestation-v2/
          sha256sum /tmp/starcom-c3-worker-attestation-v2/apply_patch.py

      - name: Establish exact RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-executor-worker-attestation-v2 \
            27c7b1509f5a82ac28ba4878d734e43a2e12a307
          test "$(git rev-parse HEAD)" = \
            "27c7b1509f5a82ac28ba4878d734e43a2e12a307"
          test "$(git merge-base 0c016cf46ada81b1b39520135070db63919c5b4e HEAD)" = \
            "0c016cf46ada81b1b39520135070db63919c5b4e"
          test -f src/starcom/executor_registry.py
          test -f tests/test_executor_worker_attestation.py
          ! grep -Fq 'registry: C3ExecutorRegistry' src/starcom/adoption_execution.py

      - name: Re-prove exact worker-attestation RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          counts = {
              'execution': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_hardening.py'
              ).countTestCases(),
              'attestation': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_executor_worker_attestation.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          expected = {
              'execution': 10,
              'hardening': 6,
              'attestation': 12,
              'total': 271,
          }
          print(counts)
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          set +e
          python3 -m unittest discover -s tests \
            -p 'test_executor_worker_attestation.py' -v \
            > /tmp/starcom-c3-worker-attestation-v2/red.log 2>&1
          status=$?
          set -e
          cat /tmp/starcom-c3-worker-attestation-v2/red.log
          test "$status" -ne 0
          grep -Fq 'Ran 12 tests' \
            /tmp/starcom-c3-worker-attestation-v2/red.log
          grep -Fq 'FAILED (errors=12)' \
            /tmp/starcom-c3-worker-attestation-v2/red.log
          test "$(grep -c '^FAIL:' /tmp/starcom-c3-worker-attestation-v2/red.log || true)" -eq 0
          test "$(grep -c '^ERROR:' /tmp/starcom-c3-worker-attestation-v2/red.log || true)" -eq 12
          grep -Fq \
            'C3AdoptionExecutionWorker.__init__() takes from 3 to 4 positional arguments but 5 were given' \
            /tmp/starcom-c3-worker-attestation-v2/red.log

      - name: Apply bounded registry-attestation patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-worker-attestation-v2/apply_patch.py
          grep -Fq 'registry: C3ExecutorRegistry' src/starcom/adoption_execution.py
          grep -Fq 'executor-registry-attestation' src/starcom/adoption_execution.py
          grep -Fq 'implementation_version: str' src/starcom/adoption_execution.py
          grep -Fq 'implementation_digest: str' src/starcom/adoption_execution.py
          test "$(grep -c 'self.registry.attest(' src/starcom/adoption_execution.py)" -eq 1
          python3 scripts/build_manifest.py --root . \
            --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests \
            -p 'test_adoption_execution.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_adoption_execution_hardening.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_executor_worker_attestation.py' -v
          python3 - <<'PY'
          import unittest
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'test_count={total}')
          if total != 271:
              raise SystemExit(f'expected 271 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover \
            -s tests -p 'test_*execution*.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: require executor registry attestation before C3 effects'
          git push origin 'HEAD:refs/heads/fix/c3-executor-worker-attestation-v2'
          git rev-parse HEAD
