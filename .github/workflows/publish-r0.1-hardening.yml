name: Publish verified STARCOM R0.1 hardening

on:
  push:
    branches:
      - control/r0.1-hardening-20260813-v15
    paths:
      - '.control/**'
      - '.github/workflows/publish-r0.1-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-r0.1-hardening-publication
  cancel-in-progress: false

jobs:
  harden-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout preserved source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 89cd48e01b67def0a6a8e9a9ed43c95a08de53e0
          fetch-depth: 0

      - name: Establish bounded target branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C fix/r0.1-repository-hardening-v1

      - name: Prove the new policy test starts RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          cat > tests/test_text_style.py <<'PY'
          from __future__ import annotations

          import unittest

          from scripts.text_style import inspect_text_style


          class TextStylePolicyTests(unittest.TestCase):
              def test_rejects_trailing_spaces_with_exact_location(self) -> None:
                  sample = "clean\ntrailing spaces" + (" " * 2) + "\n"
                  findings = inspect_text_style("README.md", sample)

                  self.assertTrue(
                      any(
                          finding.code == "TRAILING_WHITESPACE"
                          and finding.path == "README.md"
                          and finding.line == 2
                          for finding in findings
                      )
                  )

              def test_rejects_trailing_tab(self) -> None:
                  sample = "key = 1" + chr(9) + "\n"
                  findings = inspect_text_style("config.toml", sample)

                  self.assertEqual(("TRAILING_WHITESPACE",), tuple(item.code for item in findings))

              def test_rejects_extra_eof_blank_lines(self) -> None:
                  findings = inspect_text_style("src/starcom/module.py", "VALUE = 1\n\n")

                  self.assertIn("EXTRA_EOF_BLANK_LINES", {finding.code for finding in findings})

              def test_accepts_exactly_one_terminal_newline(self) -> None:
                  findings = inspect_text_style("src/starcom/module.py", "VALUE = 1\n")

                  self.assertEqual((), findings)


          if __name__ == "__main__":
              unittest.main()
          PY
          set +e
          python3 -m unittest discover -s tests -p 'test_text_style.py' -v > /tmp/starcom-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-red.log
          if [ "$red_status" -eq 0 ]; then
            echo 'Expected RED failure before implementation.' >&2
            exit 1
          fi
          grep -q 'scripts.text_style' /tmp/starcom-red.log

      - name: Implement style policy and integrate verifier
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          cat > scripts/text_style.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass


          @dataclass(frozen=True)
          class TextStyleFinding:
              code: str
              path: str
              line: int | None
              message: str


          def inspect_text_style(path: str, text: str) -> tuple[TextStyleFinding, ...]:
              findings: list[TextStyleFinding] = []

              for line_number, line in enumerate(text.splitlines(), 1):
                  if line.endswith((" ", "\t")):
                      findings.append(
                          TextStyleFinding(
                              "TRAILING_WHITESPACE",
                              path,
                              line_number,
                              "trailing spaces or tabs are forbidden",
                          )
                      )

              if text.endswith(("\n\n", "\r\n\r\n")):
                  findings.append(
                      TextStyleFinding(
                          "EXTRA_EOF_BLANK_LINES",
                          path,
                          len(text.splitlines()),
                          "text files must end with exactly one newline",
                      )
                  )

              return tuple(findings)
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_repo.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from scripts.build_manifest import verify_manifest  # noqa: E402\n',
              'from scripts.build_manifest import parse_manifest, verify_manifest  # noqa: E402\n',
          )
          marker_import = 'from scripts.secret_scan import scan_repository  # noqa: E402\n'
          if 'from scripts.text_style import inspect_text_style' not in text:
              text = text.replace(
                  marker_import,
                  marker_import + 'from scripts.text_style import inspect_text_style  # noqa: E402\n',
              )
          marker = '    manifest = verify_manifest(ROOT, ROOT / "MANIFEST.sha256")\n'
          if '===== text-style =====' not in text:
              block = '''    style_findings = []
              style_paths = [*parse_manifest(ROOT / "MANIFEST.sha256"), "MANIFEST.sha256"]
              for relative in style_paths:
                  raw = (ROOT / relative).read_bytes()
                  if b"\\x00" in raw:
                      continue
                  try:
                      text = raw.decode("utf-8")
                  except UnicodeDecodeError:
                      continue
                  style_findings.extend(inspect_text_style(relative, text))
              print("===== text-style =====")
              for finding in style_findings:
                  print(json.dumps(asdict(finding), sort_keys=True))
              print(f"text_style findings={len(style_findings)}")
              steps.append(
                  StepResult("text-style", not style_findings, int(bool(style_findings)), ("in-process",))
              )

          '''
              if marker not in text:
                  raise SystemExit('verify_repo manifest marker not found')
              text = text.replace(marker, block + marker)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Normalize only detected source-style defects
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.build_manifest import parse_manifest
          from scripts.text_style import inspect_text_style

          root = Path('.').resolve()
          paths = [
              *parse_manifest(root / 'MANIFEST.sha256'),
              'MANIFEST.sha256',
              'scripts/text_style.py',
              'tests/test_text_style.py',
          ]
          findings = []
          for relative in dict.fromkeys(paths):
              path = root / relative
              if not path.exists():
                  continue
              raw = path.read_bytes()
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              findings.extend(inspect_text_style(relative, text))

          for finding in findings:
              print(f'normalizing {finding.code} {finding.path}:{finding.line}')
          for relative in sorted({item.path for item in findings}):
              path = root / relative
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              normalized = '\n'.join(line.rstrip(' \t') for line in lines).rstrip('\n') + '\n'
              path.write_text(normalized, encoding='utf-8')
          PY
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Run complete fresh verification
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 scripts/verify_repo.py
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          git add -A
          git diff --cached --check

      - name: Publish verified hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git commit -m 'fix: enforce deterministic repository text policy'
          git push origin 'HEAD:refs/heads/fix/r0.1-repository-hardening-v1'
