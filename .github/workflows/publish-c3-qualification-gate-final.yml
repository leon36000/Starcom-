name: Publish verified STARCOM C3 qualification gate

on:
  push:
    branches:
      - control/c3-qualification-gate-final-20260814
    paths:
      - '.github/workflows/publish-c3-qualification-gate-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-qualification-gate-publication
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-qualification-gate-final-20260814
          fetch-depth: 0

      - name: Establish exact GREEN product baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-qualification-gate 98367fd2ae7f5a960cc6a1ef9c7597f965a67070
          test "$(git rev-parse HEAD)" = "98367fd2ae7f5a960cc6a1ef9c7597f965a67070"

      - name: Re-prove focused C3 GREEN and refresh manifest
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_qualification*.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_qualification*.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 14:
              raise SystemExit(f'expected 14 qualification tests, found {focused}')
          if total != 168:
              raise SystemExit(f'expected 168 tests, found {total}')
          PY
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify complete repository and deterministic stress
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: gate C3 qualification on verified C2 certification'
          git push origin 'HEAD:refs/heads/fix/c3-qualification-gate'
          git rev-parse HEAD
