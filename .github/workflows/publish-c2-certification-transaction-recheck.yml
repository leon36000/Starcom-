name: Publish transaction-locked STARCOM C2 certification protocol

on:
  push:
    branches:
      - control/c2-certification-transaction-recheck-20260814
    paths:
      - '.control/c2-certification-transaction-recheck/**'
      - '.github/workflows/publish-c2-certification-transaction-recheck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-certification-transaction-recheck
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c2-certification-transaction-recheck-20260814
          fetch-depth: 0

      - name: Preserve bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c2-certification-transaction
          cp .control/c2-certification-transaction-recheck/apply_patch.py \
            /tmp/starcom-c2-certification-transaction/
          sha256sum /tmp/starcom-c2-certification-transaction/apply_patch.py

      - name: Establish exact normalized certification baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-signed-certification-final-v2 \
            61997d55c847b23c21290d1f477b6d5195c73662
          test "$(git rev-parse HEAD)" = \
            "61997d55c847b23c21290d1f477b6d5195c73662"

      - name: Add two transaction-race attacks and prove RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-certification-transaction/apply_patch.py tests
          set +e
          python3 -m unittest discover -s tests -p 'test_certification.py' -v \
            > /tmp/starcom-c2-certification-transaction/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c2-certification-transaction/red.log
          test "$red_status" -ne 0
          failures="$(grep -c '^FAIL:' /tmp/starcom-c2-certification-transaction/red.log || true)"
          errors="$(grep -c '^ERROR:' /tmp/starcom-c2-certification-transaction/red.log || true)"
          test "$failures" -eq 2
          test "$errors" -eq 0
          grep -Fq 'test_census_is_rechecked_inside_admission_transaction' \
            /tmp/starcom-c2-certification-transaction/red.log
          grep -Fq 'test_trust_root_is_rechecked_inside_admission_transaction' \
            /tmp/starcom-c2-certification-transaction/red.log
          occurrences="$(grep -c 'IntegrityError not raised' /tmp/starcom-c2-certification-transaction/red.log || true)"
          test "$occurrences" -eq 2

      - name: Apply transaction-locked sovereign rechecks and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-certification-transaction/apply_patch.py production
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_certification.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_certification.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 10:
              raise SystemExit(f'expected 10 certification tests, found {focused}')
          if total != 151:
              raise SystemExit(f'expected 151 tests, found {total}')
          PY
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish final verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'fix: recheck C2 certification authority inside transaction'
          git push origin 'HEAD:refs/heads/fix/c2-signed-certification-final-v2'
          git rev-parse HEAD
