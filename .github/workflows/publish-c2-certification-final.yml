name: Publish verified STARCOM signed C2 certification protocol

on:
  push:
    branches:
      - control/c2-certification-final-20260814
    paths:
      - '.control/c2-certification-final/**'
      - '.github/workflows/publish-c2-certification-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-certification-final-publication
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c2-certification-final-20260814
          fetch-depth: 0

      - name: Preserve bounded fixture correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c2-certification
          cp .control/c2-certification-final/apply_fixture_patch.py /tmp/starcom-c2-certification/
          sha256sum /tmp/starcom-c2-certification/apply_fixture_patch.py

      - name: Establish exact implementation baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-signed-certification 84be40a736e6bfe9ec653dcb1edff9aa80c67477
          test "$(git rev-parse HEAD)" = "84be40a736e6bfe9ec653dcb1edff9aa80c67477"

      - name: Re-prove isolated fixture defect with seven product tests green
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_certification.py' -v > /tmp/starcom-c2-certification/baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/starcom-c2-certification/baseline.log
          test "$status" -ne 0
          errors="$(grep -c '^ERROR:' /tmp/starcom-c2-certification/baseline.log || true)"
          failures="$(grep -c '^FAIL:' /tmp/starcom-c2-certification/baseline.log || true)"
          test "$errors" -eq 1
          test "$failures" -eq 0
          grep -Fq 'test_below_target_is_rejected' /tmp/starcom-c2-certification/baseline.log
          grep -Fq 'C2 census verification failed' /tmp/starcom-c2-certification/baseline.log
          for test_name in \
            test_invalid_exact_byte_signature_is_rejected \
            test_non_independent_certifier_is_rejected \
            test_exact_800_member_certificate_is_stored_verified_and_idempotent \
            test_modified_payload_with_original_signature_is_rejected \
            test_membership_tampering_is_detected \
            test_certification_event_repointing_is_detected \
            test_certified_snapshot_remains_stable_after_later_identity; do
            grep -Fq "$test_name" /tmp/starcom-c2-certification/baseline.log
            grep -F "$test_name" /tmp/starcom-c2-certification/baseline.log | grep -Fq '... ok'
          done

      - name: Apply bounded clean below-target fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-certification/apply_fixture_patch.py

      - name: Verify eight certification attacks and refresh manifest
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_certification.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_certification.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 8:
              raise SystemExit(f'expected 8 certification tests, found {focused}')
          if total != 149:
              raise SystemExit(f'expected 149 tests, found {total}')
          PY
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify complete repository and deterministic stress
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: admit exact-byte independently signed C2 certifications'
          git push origin 'HEAD:refs/heads/fix/c2-signed-certification'
          git rev-parse HEAD
