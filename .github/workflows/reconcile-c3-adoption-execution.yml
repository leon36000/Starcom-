name: Reconcile hardened STARCOM C3 adoption execution

on:
  push:
    branches:
      - control/c3-adoption-execution-reconcile-20260814
    paths:
      - '.control/c3-adoption-execution-reconcile/**'
      - '.github/workflows/reconcile-c3-adoption-execution.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-main-integration
  cancel-in-progress: false

jobs:
  reconcile-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reconciliation control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-adoption-execution-reconcile-20260814
          fetch-depth: 0

      - name: Freeze remote refs and choose reconciliation mode
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/c3-adoption-execution fix/c3-adoption-execution || true
          base="$(git rev-parse origin/main)"
          agent="$(git rev-parse origin/agent/c3-adoption-execution)"
          feature="$(git rev-parse origin/fix/c3-adoption-execution 2>/dev/null || true)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "base=$base"
          echo "agent=$agent"
          echo "feature=$feature"
          test "$(git merge-base f20b1ba6d4e78c990c6ee6df2b19a157127b3c44 "$base")" = "f20b1ba6d4e78c990c6ee6df2b19a157127b3c44"
          git switch -C reconcile/c3-adoption-execution "$base"
          if test "$base" = "f20b1ba6d4e78c990c6ee6df2b19a157127b3c44"; then
            test -n "$feature"
            git merge --no-ff --no-edit "$feature"
            echo "mode=merge-feature" >> "$GITHUB_OUTPUT"
          elif test -f src/starcom/adoption_execution.py && ! grep -Fq 'C3 adoption execution is not implemented' src/starcom/adoption_execution.py; then
            if test -f tests/test_adoption_execution_hardening.py; then
              echo "mode=already-hardened" >> "$GITHUB_OUTPUT"
            else
              git show "$agent:tests/test_adoption_execution_hardening.py" > tests/test_adoption_execution_hardening.py
              python3 .control/c3-adoption-execution-reconcile/harden_main.py
              python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write
              echo "mode=harden-integrated" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'main is neither the exact pre-execution base nor an integrated execution authority' >&2
            exit 1
          fi

      - name: Verify hardened repository completely
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          test -f src/starcom/adoption_execution.py
          ! grep -Fq 'C3 adoption execution is not implemented' src/starcom/adoption_execution.py
          test -f tests/test_durable_transaction.py
          test -f tests/test_adoption_execution.py
          test -f tests/test_adoption_execution_hardening.py
          python3 - <<'PY'
          import unittest
          counts = {
              'durable': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_durable_transaction.py'
              ).countTestCases(),
              'execution': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_hardening.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          print(counts)
          expected = {'durable': 2, 'execution': 10, 'hardening': 6, 'total': 230}
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          python3 -m unittest discover -s tests -p 'test_durable_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution.py' -v
          python3 -m unittest discover -s tests -p 'test_adoption_execution_hardening.py' -v
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --check
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_adoption_execution*.py'
          git diff '${{ steps.refs.outputs.base }}'..HEAD --check

      - name: Commit reconciliation when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ steps.refs.outputs.mode }}'
          if test "$mode" = "harden-integrated"; then
            git config user.name 'STARCOM Verification Bot'
            git config user.email 'starcom-verification-bot@users.noreply.github.com'
            git add MANIFEST.sha256 src/starcom/adoption_execution.py tests/test_adoption_execution_hardening.py
            git commit -m 'test: harden C3 execution pre-effect and verifier falsification'
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recheck immutable refs and publish exact reconciled head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/c3-adoption-execution fix/c3-adoption-execution || true
          test "$(git rev-parse origin/main)" = '${{ steps.refs.outputs.base }}'
          test "$(git rev-parse origin/agent/c3-adoption-execution)" = '${{ steps.refs.outputs.agent }}'
          if test '${{ steps.refs.outputs.mode }}' = 'merge-feature'; then
            test "$(git rev-parse origin/fix/c3-adoption-execution)" = '${{ steps.refs.outputs.feature }}'
          fi
          if test '${{ steps.refs.outputs.mode }}' = 'already-hardened'; then
            test "$(git rev-parse HEAD)" = '${{ steps.refs.outputs.base }}'
            echo 'main already contains the fully hardened execution authority'
          else
            git push origin 'HEAD:refs/heads/main'
          fi
          git rev-parse HEAD
