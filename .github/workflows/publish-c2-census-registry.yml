name: Publish verified STARCOM C2 census identity registry

on:
  push:
    branches:
      - agent/c2-census-identity-registry
    paths:
      - '.control/c2-census-registry/**'
      - '.github/workflows/publish-c2-census-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c2-census-registry-publication
  cancel-in-progress: false

jobs:
  fixture-correct-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout control-bearing branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/c2-census-identity-registry
          fetch-depth: 0

      - name: Preserve bounded fixture replacement outside product worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c2-census
          cp .control/c2-census-registry/replace_fixture.py /tmp/starcom-c2-census/
          sha256sum /tmp/starcom-c2-census/replace_fixture.py

      - name: Establish exact implementation baseline with known fixture defect
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c2-census-identity-registry e0ff8a8365810def6b47bd4b2cecc36dbc0f8b0e
          test "$(git rev-parse HEAD)" = "e0ff8a8365810def6b47bd4b2cecc36dbc0f8b0e"

      - name: Re-prove fixture-only foreign-key failure
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_census.py' -v > /tmp/starcom-c2-census/fixture-red.log 2>&1
          status=$?
          set -e
          cat /tmp/starcom-c2-census/fixture-red.log
          test "$status" -ne 0
          errors="$(grep -c '^ERROR:' /tmp/starcom-c2-census/fixture-red.log || true)"
          failures="$(grep -c '^FAIL:' /tmp/starcom-c2-census/fixture-red.log || true)"
          test "$errors" -eq 4
          test "$failures" -eq 0
          grep -Fq 'no such table: main.c2_recollections' /tmp/starcom-c2-census/fixture-red.log
          grep -Fq 'test_foreign_source_and_dirty_c2_are_rejected' /tmp/starcom-c2-census/fixture-red.log

      - name: Replace fake fixture with real C1-to-C2 chain
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c2-census/replace_fixture.py

      - name: Verify focused census GREEN
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_census.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover('tests', pattern='test_census.py').countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 5:
              raise SystemExit(f'expected 5 census tests, found {focused}')
          if total != 123:
              raise SystemExit(f'expected 123 tests, found {total}')
          PY

      - name: Refresh deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify complete repository and deterministic stress
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          for seed in 0 1 7 42 999; do
            PYTHONHASHSEED="$seed" python3 -m unittest discover -s tests
          done
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests
          git add -A
          git diff --cached --check

      - name: Publish clean verified product branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: add evidence-bound C2 census identity registry'
          git push --force-with-lease origin 'HEAD:refs/heads/fix/c2-census-identity-registry'
          git rev-parse HEAD
