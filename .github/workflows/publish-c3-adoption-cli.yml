name: Publish verified STARCOM C3 adoption CLI

on:
  push:
    branches:
      - control/c3-adoption-cli-20260814
    paths:
      - '.control/c3-adoption-cli/**'
      - '.github/workflows/publish-c3-adoption-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-c3-adoption-cli-publication
  cancel-in-progress: false

jobs:
  red-green-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-adoption-cli-20260814
          fetch-depth: 0

      - name: Preserve and normalize bounded patch outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/starcom-c3-adoption-cli
          cp .control/c3-adoption-cli/apply_patch.py /tmp/starcom-c3-adoption-cli/
          python3 .control/c3-adoption-cli/normalize_patch.py
          sha256sum /tmp/starcom-c3-adoption-cli/apply_patch.py

      - name: Establish exact final RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STARCOM Verification Bot'
          git config user.email 'starcom-verification-bot@users.noreply.github.com'
          git switch -C fix/c3-adoption-cli b5026c8b7ad6afd1ea2c3f43557a82624d638738
          test "$(git rev-parse HEAD)" = "b5026c8b7ad6afd1ea2c3f43557a82624d638738"

      - name: Re-prove exact C3 adoption CLI RED
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tests -p 'test_adoption_cli.py' -v > /tmp/starcom-c3-adoption-cli/red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/starcom-c3-adoption-cli/red.log
          test "$red_status" -ne 0
          grep -Fq 'Ran 4 tests' /tmp/starcom-c3-adoption-cli/red.log
          grep -Fq 'FAILED (failures=3)' /tmp/starcom-c3-adoption-cli/red.log
          test "$(grep -c '^FAIL:' /tmp/starcom-c3-adoption-cli/red.log || true)" -eq 3
          test "$(grep -c '^ERROR:' /tmp/starcom-c3-adoption-cli/red.log || true)" -eq 0
          grep -Fq "invalid choice: 'adoption'" /tmp/starcom-c3-adoption-cli/red.log
          grep -Fq 'test_no_execution_subcommand_is_exposed (test_adoption_cli.C3AdoptionCliTests.test_no_execution_subcommand_is_exposed) ... ok' /tmp/starcom-c3-adoption-cli/red.log

      - name: Apply thin CLI patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/starcom-c3-adoption-cli/apply_patch.py
          test "$(grep -c '^    def _adoption_' src/starcom/cli.py || true)" -eq 0
          test "$(grep -c '^def _adoption_' src/starcom/cli.py)" -eq 4
          python3 scripts/build_manifest.py --root . --manifest MANIFEST.sha256 --write

      - name: Verify focused GREEN and complete repository
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_adoption_cli.py' -v
          python3 - <<'PY'
          import unittest
          focused = unittest.defaultTestLoader.discover(
              'tests', pattern='test_adoption_cli.py'
          ).countTestCases()
          total = unittest.defaultTestLoader.discover('tests').countTestCases()
          print(f'focused_count={focused}')
          print(f'test_count={total}')
          if focused != 4:
              raise SystemExit(f'expected 4 adoption CLI tests, found {focused}')
          if total != 212:
              raise SystemExit(f'expected 212 tests, found {total}')
          PY
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests
          PYTHONWARNINGS=error python3 -X dev -m unittest discover -s tests -p 'test_adoption_cli.py'
          git add -A
          git diff --cached --check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: expose non-executing C3 adoption CLI'
          git push origin 'HEAD:refs/heads/fix/c3-adoption-cli'
          git rev-parse HEAD
