name: Gate STARCOM C3 executor registry work

on:
  push:
    branches:
      - control/c3-executor-registry-next-gate-20260814
    paths:
      - '.github/workflows/gate-c3-executor-registry.yml'
      - '.control/c3-executor-registry-next-gate/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starcom-next-work-gate
  cancel-in-progress: false

jobs:
  verify-main-and-create-registry-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout gate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: control/c3-executor-registry-next-gate-20260814
          fetch-depth: 0

      - name: Freeze and checkout current main
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main="$(git rev-parse origin/main)"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          git switch -C gate/c3-executor-registry "$main"
          test -f src/starcom/adoption_execution.py
          test -f tests/test_adoption_execution_hardening.py
          test -f tests/test_adoption_execution_cli.py
          grep -Fq '"adoption-execution"' src/starcom/cli.py
          ! grep -Fq 'C3AdoptionExecutionWorker' src/starcom/cli.py

      - name: Verify required main evidence
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import unittest
          counts = {
              'execution': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution.py'
              ).countTestCases(),
              'hardening': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_hardening.py'
              ).countTestCases(),
              'execution_cli': unittest.defaultTestLoader.discover(
                  'tests', pattern='test_adoption_execution_cli.py'
              ).countTestCases(),
              'total': unittest.defaultTestLoader.discover('tests').countTestCases(),
          }
          print(counts)
          expected = {
              'execution': 10,
              'hardening': 6,
              'execution_cli': 4,
              'total': 234,
          }
          if counts != expected:
              raise SystemExit(f'expected {expected}, found {counts}')
          PY
          python3 -m unittest discover -s tests -p 'test_adoption_execution_cli.py' -v
          python3 scripts/verify_repo.py
          python3 -m compileall -q src scripts tests
          python3 scripts/secret_scan.py --root .
          PYTHONHASHSEED=7 python3 -m unittest discover -s tests

      - name: Recheck main and create executor registry branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '${{ steps.refs.outputs.main }}'
          if git ls-remote --exit-code --heads origin agent/c3-executor-registry >/dev/null 2>&1; then
            remote="$(git ls-remote --heads origin agent/c3-executor-registry | awk '{print $1}')"
            test "$remote" = '${{ steps.refs.outputs.main }}'
          else
            git push origin 'HEAD:refs/heads/agent/c3-executor-registry'
          fi
          echo "verified_main=${{ steps.refs.outputs.main }}"
